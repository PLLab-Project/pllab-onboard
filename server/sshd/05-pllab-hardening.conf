PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
LoginGraceTime 30
MaxStartups 30:30:200
# Every Cloudflare Tunnel connection arrives from the cloudflared container on
# the pllab-edge network, so penalising that address would lock out everyone.
PerSourcePenaltyExemptList 172.18.0.0/16
